plugins {
    id 'com.android.application'
}

android {
    namespace 'com.microbite.kitchendashboard'
    compileSdk 34

    defaultConfig {
        applicationId "com.microbite.kitchendashboard"
        minSdk 21
        targetSdk 34
        versionCode 8
        versionName "1.1.6"
    }

    // Give built APKs a memorable, versioned filename instead of app-debug.apk
    // e.g. mbpos-kitchen-v1.1.3-debug.apk
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "mbpos-kitchen-v${variant.versionName}-${variant.buildType.name}.apk"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference:1.2.1'
    // QR scanning for the "Scan QR" setup flow (handles its own camera permission)
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
