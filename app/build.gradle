plugins {
    id 'com.android.application'
}

android {
    namespace 'com.microbite.kitchendashboard'
    compileSdk 34

    defaultConfig {
        applicationId "com.microbite.kitchendashboard"
        minSdk 21
        targetSdk 34
        versionCode 14
        versionName "1.2.2"
    }

    // Give built APKs a memorable, versioned filename instead of app-debug.apk
    // e.g. mbpos-kitchen-v1.1.3-debug.apk
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "mbpos-kitchen-v${variant.versionName}-${variant.buildType.name}.apk"
        }
    }

    // A FIXED debug keystore so every build — CI or local — signs with the same
    // key. Without it, CI mints a throwaway key each run, so a freshly built APK
    // refuses to install over an older one ("App not installed") and the old
    // copy has to be uninstalled first. The keystore lives at app/keystore/ and
    // is created + committed automatically by CI on first run (see build.yml).
    signingConfigs {
        stableDebug {
            def ks = file('keystore/debug.keystore')
            if (ks.exists()) {
                storeFile ks
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            // Use the fixed key when it's present; otherwise fall back to the
            // auto-generated debug key so a first/local build still works.
            if (file('keystore/debug.keystore').exists()) {
                signingConfig signingConfigs.stableDebug
            }
        }
    }

    compileOptions {
        // Desugaring back-ports the Java 8 APIs that zxing:core 3.4.x uses, so
        // the live QR scanner runs on Android 6/7 instead of crashing. Without
        // this, zxing-android-embedded 4.3 only works on API 24+.
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference:1.2.1'
    // QR scanning for the "Scan QR" setup flow (handles its own camera permission)
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
